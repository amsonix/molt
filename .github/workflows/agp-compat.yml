name: AGP Compatibility Probe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :plugin:moltObfuscateCheck --no-daemon

  agp-probe:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - agp: "8.0.2"
            gradle: "8.0"
            required: "0"
          - agp: "8.1.4"
            gradle: "8.0"
            required: "0"
          - agp: "8.2.2"
            gradle: "8.2"
            required: "0"
          - agp: "8.3.2"
            gradle: "8.4"
            required: "0"
          - agp: "8.4.2"
            gradle: "8.6"
            required: "0"
          - agp: "8.5.2"
            gradle: "8.7"
            required: "0"
          - agp: "8.6.1"
            gradle: "8.7"
            required: "0"
          - agp: "8.7.3"
            gradle: "8.9"
            required: "0"
          - agp: "8.8.2"
            gradle: "8.10.2"
            required: "0"
          - agp: "8.9.2"
            gradle: "8.11.1"
            required: "0"
          - agp: "8.10.1"
            gradle: "8.11.1"
            required: "0"
          - agp: "8.11.2"
            gradle: "8.13"
            required: "0"
          - agp: "8.12.2"
            gradle: "8.13"
            required: "0"
          - agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - agp: "9.0.0"
            gradle: "9.1"
            required: "0"
          - agp: "9.1.1"
            gradle: "9.3.1"
            required: "0"
          - agp: "9.2.0"
            gradle: "9.4.1"
            required: "0"
          - agp: "9.3.0"
            gradle: "9.5"
            required: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Smoke
        id: smoke
        continue-on-error: true
        run: |
          ./gradlew :plugin:moltObfuscateAgpCompatTest \
            -PtestAgp=${{ matrix.agp }} -PtestGradle=${{ matrix.gradle }} --no-daemon

      - name: APK E2E
        id: apk
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew :plugin:moltObfuscateAgpCompatE2eTest \
            -PtestAgp=${{ matrix.agp }} -PtestGradle=${{ matrix.gradle }} --no-daemon

      - name: AAB E2E
        id: aab
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew :plugin:moltObfuscateAgpCompatBundleE2eTest \
            -PtestAgp=${{ matrix.agp }} -PtestGradle=${{ matrix.gradle }} --no-daemon

      - name: APK rename E2E
        id: apk_rename
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew :plugin:moltObfuscateAgpCompatRenameApkE2eTest \
            -PtestAgp=${{ matrix.agp }} -PtestGradle=${{ matrix.gradle }} --no-daemon

      - name: AAB rename E2E
        id: aab_rename
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew :plugin:moltObfuscateAgpCompatRenameAabE2eTest \
            -PtestAgp=${{ matrix.agp }} -PtestGradle=${{ matrix.gradle }} --no-daemon

      - name: Fail if required row incomplete
        if: matrix.required == '1'
        run: |
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.apk.outcome }}" = "success"
          test "${{ steps.aab.outcome }}" = "success"
          test "${{ steps.apk_rename.outcome }}" = "success"
          test "${{ steps.aab_rename.outcome }}" = "success"
