name: Feature Probe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

# GitHub runners 不在中国大陆，直接用 google()/mavenCentral() 更稳；
# aliyun 镜像在 CI 上偶发 502 会整行失败（本地跑探针仍默认走镜像）。
env:
  MOLT_PROBE_CHINA_MIRROR: 0

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :plugin:moltObfuscateCheck --no-daemon

  feature-probe-gate:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: F00-baseline
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F01-overlay-rename
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F05-arsc-apk
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F06-arsc-aab
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F09-rename-apk
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F16-string-fog-assets
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4

      - name: Feature probe row
        id: probe
        continue-on-error: true
        run: |
          ./gradlew :plugin:moltObfuscateFeatureProbeTest \
            -PmoltFeature=${{ matrix.feature }} \
            -PtestAgp=${{ matrix.agp }} \
            -PtestGradle=${{ matrix.gradle }} \
            --no-daemon

      - name: Fail if required row failed
        if: matrix.required == '1' && steps.probe.outcome != 'success'
        run: |
          test "${{ steps.probe.outcome }}" = "success" || true
          echo "::group::Probe test results XML (nested build output)"
          cat plugin/build/test-results/moltObfuscateFeatureProbeTest/TEST-*.xml || true
          echo "::endgroup::"
          exit 1

      - name: Upload probe test results on failure
        if: always() && steps.probe.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: probe-results-${{ matrix.feature }}
          path: |
            plugin/build/test-results/moltObfuscateFeatureProbeTest/
            plugin/build/reports/tests/moltObfuscateFeatureProbeTest/
          if-no-files-found: ignore

  feature-probe-gate-agp802:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: |
          MOLT_FEATURE_AGP=8.0.2 MOLT_FEATURE_GRADLE=8.0 FEATURE_PROBE_TIER=gate ./tools/feature-probe.sh
      - name: Upload probe results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results-agp802
          path: |
            plugin/build/test-results/moltObfuscateFeatureProbeTest/
            plugin/build/reports/tests/moltObfuscateFeatureProbeTest/
            build/reports/feature-probe/
          if-no-files-found: ignore

  feature-probe-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: FEATURE_PROBE_TIER=nightly ./tools/feature-probe.sh

  feature-probe-cross-agp:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: F00-baseline
            agp: "9.3.0"
            gradle: "9.5.0"
          - feature: F05-arsc-apk
            agp: "9.3.0"
            gradle: "9.5.0"
          - feature: F09-rename-apk
            agp: "9.3.0"
            gradle: "9.5.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: |
          ./gradlew :plugin:moltObfuscateFeatureProbeTest \
            -PmoltFeature=${{ matrix.feature }} \
            -PtestAgp=${{ matrix.agp }} \
            -PtestGradle=${{ matrix.gradle }} \
            --no-daemon

  runtime-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest 默认不把 runner 用户放进 kvm 组。emulator-runner 探测 KVM 失败后会
      # 强制 "-accel off"（x86_64 纯软件模拟）：启动 >6 分钟、且 adb 操作随机失败。
      # 这是 reactivecircus/android-emulator-runner README 记载的官方修复方式。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Run runtime smoke probe
        id: probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            MOLT_FEATURE_PROBE=F19-runtime-smoke RUN_SHELL_TRANSFORM_E2E=1 ./gradlew :plugin:moltObfuscateFeatureProbeTest --no-daemon

      - name: Runtime smoke diagnostics
        if: always() && steps.probe.outcome == 'failure'
        run: |
          echo "::group::Runtime smoke test results XML"
          cat plugin/build/test-results/moltObfuscateFeatureProbeTest/TEST-*.xml || true
          echo "::endgroup::"

      - name: Upload runtime smoke results on failure
        if: always() && steps.probe.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-results-${{ matrix.api-level }}
          path: |
            plugin/build/test-results/moltObfuscateFeatureProbeTest/
            plugin/build/reports/tests/moltObfuscateFeatureProbeTest/
          if-no-files-found: ignore

  feature-probe-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :plugin:publishToMavenLocal
      - run: FEATURE_PROBE_TIER=weekly ./tools/feature-probe.sh
