name: Feature Probe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :plugin:moltObfuscateCheck --no-daemon

  feature-probe-gate:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: F00-baseline
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F01-overlay-rename
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F05-arsc-apk
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F06-arsc-aab
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F09-rename-apk
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
          - feature: F16-string-fog-assets
            agp: "8.13.2"
            gradle: "8.13"
            required: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Feature probe row
        id: probe
        continue-on-error: true
        run: |
          ./gradlew :plugin:moltObfuscateFeatureProbeTest \
            -PmoltFeature=${{ matrix.feature }} \
            -PtestAgp=${{ matrix.agp }} \
            -PtestGradle=${{ matrix.gradle }} \
            --no-daemon

      - name: Fail if required row failed
        if: matrix.required == '1'
        run: test "${{ steps.probe.outcome }}" = "success"

  feature-probe-gate-agp802:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: |
          MOLT_FEATURE_AGP=8.0.2 MOLT_FEATURE_GRADLE=8.0 FEATURE_PROBE_TIER=gate ./tools/feature-probe.sh

  feature-probe-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: FEATURE_PROBE_TIER=nightly ./tools/feature-probe.sh

  feature-probe-cross-agp:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: F00-baseline
            agp: "9.3.0"
            gradle: "9.5"
          - feature: F05-arsc-apk
            agp: "9.3.0"
            gradle: "9.5"
          - feature: F09-rename-apk
            agp: "9.3.0"
            gradle: "9.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: |
          ./gradlew :plugin:moltObfuscateFeatureProbeTest \
            -PmoltFeature=${{ matrix.feature }} \
            -PtestAgp=${{ matrix.agp }} \
            -PtestGradle=${{ matrix.gradle }} \
            --no-daemon

  runtime-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            MOLT_FEATURE_PROBE=F19-runtime-smoke RUN_SHELL_TRANSFORM_E2E=1 \
              ./gradlew :plugin:moltObfuscateFeatureProbeTest --no-daemon

  feature-probe-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: FEATURE_PROBE_TIER=weekly ./tools/feature-probe.sh
